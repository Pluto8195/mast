[package]
name = "mast-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
startup-bench = []
# Test-only PR fixture loader used by mast-ui-driver.
ui-driver = []

[dependencies]
mast-syntax.workspace = true
mast-preview.workspace = true
mast-proto.workspace = true
mast-doc.workspace = true
mast-sync.workspace = true
mast-harness.workspace = true
mast-rpc.workspace = true
mast-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
shell-words = "1.1"
regex = "1"
nucleo-matcher.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ctor = "1"
zip.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
mast-sync = { workspace = true, features = ["mock-server"] }
